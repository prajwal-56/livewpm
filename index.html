<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live WPM — Minimal Real-Time Typing Speed & Speedometer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="text">
  <div class="app-container">
    <!-- Header / Brand & Controls -->
    <header class="header">
      <div class="brand">
        <span class="brand-title">livewpm</span>
        <span class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-text" id="statusText">idle</span>
        </span>
      </div>

      <div class="header-controls">
        <!-- View Mode Segmented Control -->
        <div class="mode-switcher" role="tablist" aria-label="Display mode">
          <button class="mode-btn active" id="modeBtnText" role="tab" aria-selected="true" data-mode="text">
            <svg class="mode-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
            </svg>
            <span>Simple</span>
          </button>
          <button class="mode-btn" id="modeBtnGauge" role="tab" aria-selected="false" data-mode="gauge">
            <svg class="mode-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .284.048.557.137.812a1 1 0 001.89-.654.512.512 0 01-.027-.158c0-.435.312-.907.828-1.282A2.54 2.54 0 0110 6.223V10a1 1 0 102 0V5z" clip-rule="evenodd"/>
            </svg>
            <span>Speedometer</span>
          </button>
          <button class="mode-btn" id="modeBtnGraph" role="tab" aria-selected="false" data-mode="graph">
            <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            <span>Graph</span>
          </button>
        </div>

        <button id="resetBtn" class="btn-subtle" title="Clear text and reset stats (Esc)">
          <span>Reset</span>
          <kbd>Esc</kbd>
        </button>

        <a href="https://github.com/prajwal-56/livewpm" target="_blank" rel="noopener noreferrer" class="btn-subtle icon-btn" title="View repository on GitHub">
          <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- Main Speed Display Section -->
    <section class="speed-board">
      
      <!-- MODE A: Minimal Simple Text View -->
      <div class="view-panel view-simple" id="viewSimple">
        <div class="live-speed-wrapper">
          <div class="speed-number" id="liveWpm">0</div>
          <div class="speed-meta">
            <span class="speed-unit">wpm</span>
            <span class="tier-pill" id="tierPillSimple">Warmup</span>
          </div>
        </div>

        <!-- Live Speed Bar Track -->
        <div class="gauge-container" title="Live velocity meter">
          <div class="gauge-track">
            <div class="gauge-fill" id="gaugeFill"></div>
          </div>
        </div>
      </div>

      <!-- MODE B: Analog Speedometer Instrument Gauge -->
      <div class="view-panel view-gauge-panel" id="viewGauge">
        <div class="speedometer-container">
          <svg class="speedometer-svg" viewBox="0 0 320 220" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="arcTrackGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#dedbd2"/>
                <stop offset="100%" stop-color="#c8c5bc"/>
              </linearGradient>
            </defs>

            <!-- Background Track Arc (240 degrees, radius 110, center 160, 150) -->
            <path
              class="speedo-track"
              d="M 64.73 205 A 110 110 0 1 1 255.27 205"
              fill="none"
              stroke-linecap="round"
            />

            <!-- Dynamic Active Colored Arc -->
            <path
              id="speedoArcFill"
              class="speedo-fill"
              d="M 64.73 205 A 110 110 0 1 1 255.27 205"
              fill="none"
              stroke-linecap="round"
            />

            <!-- Scale Ticks & Numbers -->
            <g class="speedo-ticks" id="speedoTicks">
              <!-- 0 WPM -->
              <line x1="75.1" y1="199.0" x2="64.7" y2="205.0" class="tick" />
              <text x="56" y="218" class="tick-label">0</text>

              <!-- 30 WPM -->
              <line x1="63.5" y1="133.0" x2="51.7" y2="130.9" class="tick" />
              <text x="36" y="132" class="tick-label">30</text>

              <!-- 60 WPM -->
              <line x1="97.0" y1="74.9" x2="89.3" y2="65.7" class="tick" />
              <text x="76" y="55" class="tick-label">60</text>

              <!-- 90 WPM -->
              <line x1="160.0" y1="52.0" x2="160.0" y2="40.0" class="tick" />
              <text x="160" y="26" class="tick-label">90</text>

              <!-- 120 WPM -->
              <line x1="223.0" y1="74.9" x2="230.7" y2="65.7" class="tick" />
              <text x="244" y="55" class="tick-label">120</text>

              <!-- 150 WPM -->
              <line x1="256.5" y1="133.0" x2="268.3" y2="130.9" class="tick" />
              <text x="284" y="132" class="tick-label">150</text>

              <!-- 180 WPM -->
              <line x1="244.9" y1="199.0" x2="255.3" y2="205.0" class="tick" />
              <text x="264" y="218" class="tick-label">180</text>
            </g>

            <!-- Speedometer Needle (pivot at 160, 150) -->
            <g id="speedoNeedleGroup" class="needle-group">
              <polygon points="157.5,150 160,55 162.5,150 160,165" class="speedo-needle" id="speedoNeedle" />
              <!-- Center Hub -->
              <circle cx="160" cy="150" r="10" class="needle-hub-outer" />
              <circle cx="160" cy="150" r="5" class="needle-hub-inner" />
            </g>
          </svg>

          <!-- Digital Readout centered inside speedometer base -->
          <div class="speedo-digital">
            <div class="speedo-value" id="speedoValue">0</div>
            <div class="speedo-unit-row">
              <span class="speedo-unit">WPM</span>
              <span class="tier-pill" id="tierPillGauge">Warmup</span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- MODE C: Live ECG Graph -->
      <div class="view-panel view-graph-panel" id="viewGraph">
        <div class="live-speed-wrapper">
          <div class="speed-number" id="graphWpm">0</div>
          <div class="speed-meta">
            <span class="speed-unit">wpm</span>
            <span class="tier-pill" id="tierPillGraph">Warmup</span>
          </div>
        </div>
        <div class="graph-container">
          <canvas id="speedCanvas"></canvas>
        </div>
      </div>

      <!-- Secondary Metrics Grid -->
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-title">Average</span>
          <span class="metric-value" id="avgWpm">0</span>
          <span class="metric-sub">wpm</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Peak</span>
          <span class="metric-value" id="peakWpm">0</span>
          <span class="metric-sub">wpm</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Characters</span>
          <span class="metric-value" id="charCount">0</span>
          <span class="metric-sub">typed</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Words</span>
          <span class="metric-value" id="wordCount">0</span>
          <span class="metric-sub">count</span>
        </div>
      </div>
    </section>

    <!-- Typing Input Area -->
    <main class="editor-section">
      <div class="editor-wrapper">
        <textarea
          id="typeArea"
          class="typing-textarea"
          placeholder="Start typing anything here freely... your speed updates live as you type."
          spellcheck="false"
          autofocus
        ></textarea>
      </div>
    </main>

    <!-- Footer / Details -->
    <footer class="footer">
      <div class="footer-hint">
        <span>Press <kbd>Esc</kbd> anytime to restart</span>
        <span class="separator">•</span>
        <span>Standard: 5 characters = 1 word</span>
        <span class="separator">•</span>
        <span>Rolling 2.5s window</span>
      </div>
      <div class="footer-credit">
        <a href="https://github.com/prajwal-56/livewpm" target="_blank" rel="noopener noreferrer" class="credit-link github-pill" title="View prajwal-56/livewpm on GitHub">
          <svg class="credit-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>prajwal-56/livewpm</span>
        </a>
        <span class="credit-sep">•</span>
        <span>Made by <a href="https://github.com/prajwal-56" target="_blank" rel="noopener noreferrer" class="credit-link">P</a></span>
        <span class="credit-sep">•</span>
        <a href="https://prajwal-56.github.io/donate" target="_blank" rel="noopener noreferrer" class="credit-link support-btn">support</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
